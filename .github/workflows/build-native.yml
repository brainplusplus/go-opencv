name: Build Native Libraries

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/goopencv_abi.cpp'
      - 'build-tools/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENCV_VERSION: "4.13.0"

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-amd64
            runner: windows-2022
            artifact: goopencv-windows-amd64
            output: dist/goopencv.dll
          - name: linux-amd64
            runner: ubuntu-22.04
            artifact: goopencv-linux-amd64
            output: dist/goopencv.so
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: goopencv-linux-arm64
            output: dist/goopencv-linux-arm64.so
          - name: macos-universal
            runner: macos-14
            artifact: goopencv-macos-universal
            output: dist/goopencv.dylib

    steps:
      - uses: actions/checkout@v4

      # ── Windows ──────────────────────────────────────────────
      - name: Download opencv-mobile (Windows)
        if: matrix.platform.name == 'windows-amd64'
        shell: pwsh
        run: |
          $zip = "opencv-mobile-${env:OPENCV_VERSION}-windows-vs2019.zip"
          $url = "https://github.com/nihui/opencv-mobile/releases/latest/download/$zip"
          Invoke-WebRequest -Uri $url -OutFile "build-tools/$zip"
          Expand-Archive "build-tools/$zip" -DestinationPath "build-tools/"
          Remove-Item "build-tools/$zip"

      - name: Debug Windows SDK structure
        if: matrix.platform.name == 'windows-amd64'
        shell: pwsh
        run: |
          Get-ChildItem -Path "build-tools\opencv-mobile-*" -Directory | ForEach-Object { $_.FullName }
          $sdk = Get-ChildItem -Path "build-tools\opencv-mobile-*" -Directory | Select-Object -First 1
          if ($sdk) { Get-ChildItem $sdk.FullName -Directory | ForEach-Object { $_.FullName } }

      - name: Build goopencv.dll (Windows)
        if: matrix.platform.name == 'windows-amd64'
        shell: cmd
        run: build-tools\build-goopencv.bat

      # ── Linux amd64 ──────────────────────────────────────────
      - name: Download opencv-mobile (Linux amd64)
        if: matrix.platform.name == 'linux-amd64'
        run: |
          wget -q https://github.com/nihui/opencv-mobile/releases/latest/download/opencv-mobile-${{ env.OPENCV_VERSION }}-ubuntu-2204.zip -O /tmp/opencv-mobile.zip
          unzip -q -o /tmp/opencv-mobile.zip -d build-tools/
          rm /tmp/opencv-mobile.zip

      - name: Build goopencv.so (Linux amd64)
        if: matrix.platform.name == 'linux-amd64'
        run: bash build-tools/build-goopencv-linux.sh

      # ── Linux arm64 ──────────────────────────────────────────
      - name: Download opencv-mobile (Linux arm64)
        if: matrix.platform.name == 'linux-arm64'
        run: |
          wget -q https://github.com/nihui/opencv-mobile/releases/latest/download/opencv-mobile-${{ env.OPENCV_VERSION }}-debian-bookworm-aarch64.zip -O /tmp/opencv-mobile.zip
          unzip -q -o /tmp/opencv-mobile.zip -d build-tools/
          rm /tmp/opencv-mobile.zip

      - name: Build goopencv.so (Linux arm64)
        if: matrix.platform.name == 'linux-arm64'
        run: bash build-tools/build-goopencv-linux-arm64.sh

      # ── macOS universal ──────────────────────────────────────
      - name: Download opencv-mobile (macOS)
        if: matrix.platform.name == 'macos-universal'
        run: |
          wget -q https://github.com/nihui/opencv-mobile/releases/latest/download/opencv-mobile-${{ env.OPENCV_VERSION }}-macos.zip -O /tmp/opencv-mobile.zip
          unzip -q -o /tmp/opencv-mobile.zip -d build-tools/
          rm /tmp/opencv-mobile.zip

      - name: Debug macOS SDK structure
        if: matrix.platform.name == 'macos-universal'
        run: find build-tools/ -maxdepth 5 -type f 2>/dev/null | head -40

      - name: Build goopencv.dylib (macOS)
        if: matrix.platform.name == 'macos-universal'
        run: bash build-tools/build-goopencv-macos.sh

      # ── Upload artifact ──────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ${{ matrix.platform.output }}
          compression-level: 0

  # ── Go test on available runners ──────────────────────────
  test:
    name: Go Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-amd64
            runner: windows-2022
            artifact: goopencv-windows-amd64
            native-lib: goopencv.dll
          - name: linux-amd64
            runner: ubuntu-22.04
            artifact: goopencv-linux-amd64
            native-lib: goopencv.so
          - name: macos-arm64
            runner: macos-14
            artifact: goopencv-macos-universal
            native-lib: goopencv.dylib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist/

      - name: Run Go tests
        env:
          CGO_ENABLED: 0
        run: go test ./... -v -count=1
