name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  OPENCV_VERSION: "4.13.0"

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-amd64
            runner: windows-2022
            artifact: goopencv-windows-amd64
            output: dist/goopencv.dll
            asset-name: goopencv-windows-amd64.dll
          - name: linux-amd64
            runner: ubuntu-22.04
            artifact: goopencv-linux-amd64
            output: dist/goopencv.so
            asset-name: goopencv-linux-amd64.so
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: goopencv-linux-arm64
            output: dist/goopencv-linux-arm64.so
            asset-name: goopencv-linux-arm64.so
          - name: macos-arm64
            runner: macos-14
            artifact: goopencv-macos-arm64
            output: dist/goopencv.dylib
            asset-name: goopencv-macos-arm64.dylib
          - name: macos-x86_64
            runner: macos-13
            artifact: goopencv-macos-x86_64
            output: dist/goopencv.dylib
            asset-name: goopencv-macos-x86_64.dylib

    steps:
      - uses: actions/checkout@v4

      # ── Windows ──────────────────────────────────────────────
      - name: Download opencv-mobile (Windows)
        if: matrix.platform.name == 'windows-amd64'
        shell: pwsh
        run: |
          $zip = "opencv-mobile-${env:OPENCV_VERSION}-windows-vs2019.zip"
          $url = "https://github.com/nihui/opencv-mobile/releases/latest/download/$zip"
          Invoke-WebRequest -Uri $url -OutFile "build-tools/$zip"
          Expand-Archive "build-tools/$zip" -DestinationPath "build-tools/"
          Remove-Item "build-tools/$zip"

      - name: Build goopencv.dll (Windows)
        if: matrix.platform.name == 'windows-amd64'
        shell: cmd
        run: build-tools\build-goopencv.bat

      # ── Linux amd64 ──────────────────────────────────────────
      - name: Download opencv-mobile (Linux amd64)
        if: matrix.platform.name == 'linux-amd64'
        run: |
          wget -q https://github.com/nihui/opencv-mobile/releases/latest/download/opencv-mobile-${{ env.OPENCV_VERSION }}-ubuntu-2204.zip -O /tmp/opencv-mobile.zip
          unzip -q -o /tmp/opencv-mobile.zip -d build-tools/
          rm /tmp/opencv-mobile.zip

      - name: Build goopencv.so (Linux amd64)
        if: matrix.platform.name == 'linux-amd64'
        run: bash build-tools/build-goopencv-linux.sh

      # ── Linux arm64 ──────────────────────────────────────────
      - name: Download opencv-mobile (Linux arm64)
        if: matrix.platform.name == 'linux-arm64'
        run: |
          wget -q https://github.com/nihui/opencv-mobile/releases/latest/download/opencv-mobile-${{ env.OPENCV_VERSION }}-debian-bookworm-aarch64.zip -O /tmp/opencv-mobile.zip
          unzip -q -o /tmp/opencv-mobile.zip -d build-tools/
          rm /tmp/opencv-mobile.zip

      - name: Build goopencv.so (Linux arm64)
        if: matrix.platform.name == 'linux-arm64'
        run: bash build-tools/build-goopencv-linux-arm64.sh

      # ── macOS ──────────────────────────────────────────────
      - name: Download opencv-mobile (macOS)
        if: startsWith(matrix.platform.name, 'macos-')
        run: |
          wget -q https://github.com/nihui/opencv-mobile/releases/latest/download/opencv-mobile-${{ env.OPENCV_VERSION }}-macos.zip -O /tmp/opencv-mobile.zip
          unzip -q -o /tmp/opencv-mobile.zip -d build-tools/
          rm /tmp/opencv-mobile.zip

      - name: Build goopencv.dylib (macOS)
        if: startsWith(matrix.platform.name, 'macos-')
        run: bash build-tools/build-goopencv-macos.sh

      # ── Upload artifact ──────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ${{ matrix.platform.output }}
          compression-level: 0

  # ── macOS lipo merge ──────────────────────────────────────
  macos-lipo:
    name: macOS Universal (lipo merge)
    runs-on: macos-14
    needs: build
    steps:
      - name: Download arm64 dylib
        uses: actions/download-artifact@v4
        with:
          name: goopencv-macos-arm64
          path: ./arm64/

      - name: Download x86_64 dylib
        uses: actions/download-artifact@v4
        with:
          name: goopencv-macos-x86_64
          path: ./x86_64/

      - name: Lipo merge → universal
        run: |
          mkdir -p release-upload
          lipo -create arm64/goopencv.dylib x86_64/goopencv.dylib -output release-upload/goopencv-macos-universal.dylib
          echo "=== Universal dylib ==="
          lipo -info release-upload/goopencv-macos-universal.dylib
          ls -lh release-upload/

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: goopencv-macos-universal
          path: release-upload/goopencv-macos-universal.dylib
          compression-level: 0

  # ── Create GitHub Release ──────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, macos-lipo]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Prepare release assets
        run: |
          mkdir -p release-upload/
          cp release-assets/goopencv-windows-amd64/goopencv.dll release-upload/goopencv-windows-amd64.dll
          cp release-assets/goopencv-linux-amd64/goopencv.so release-upload/goopencv-linux-amd64.so
          cp release-assets/goopencv-linux-arm64/goopencv-linux-arm64.so release-upload/goopencv-linux-arm64.so
          cp release-assets/goopencv-macos-arm64/goopencv.dylib release-upload/goopencv-macos-arm64.dylib
          cp release-assets/goopencv-macos-x86_64/goopencv.dylib release-upload/goopencv-macos-x86_64.dylib
          cp release-assets/goopencv-macos-universal/goopencv-macos-universal.dylib release-upload/goopencv-macos-universal.dylib
          echo "=== Release assets ==="
          ls -lh release-upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
